var byKey={}; C.forEach(function(c){byKey[c.key]=c;});
var sel=[];
var DIFF=['','Beginner','Medium','Advanced'];
var chips=document.getElementById('chips'), cmp=document.getElementById('cmp'), hint=document.getElementById('hint');
function renderChips(){
  chips.innerHTML=C.map(function(c){return '<button class="chip'+(sel.indexOf(c.key)>=0?' on':'')+'" style="--cc:'+c.ac+'" data-k="'+c.key+'"><span class="d"></span>'+c.name+'</button>';}).join('');
  [].slice.call(chips.querySelectorAll('.chip')).forEach(function(b){b.addEventListener('click',function(){toggle(b.getAttribute('data-k'));});});
  hint.textContent = sel.length<2 ? 'Pick at least 2.' : (sel.length>=3 ? 'Max reached — remove one to swap.' : 'Add one more, or compare these two.');
}
function toggle(k){
  var i=sel.indexOf(k);
  if(i>=0) sel.splice(i,1);
  else { if(sel.length>=3) return; sel.push(k); }
  renderChips(); renderCmp();
}
function best(keys, field, dir){ // dir -1 = lower wins, returns winning value
  var vals=keys.map(function(k){return byKey[k][field];});
  return dir<0?Math.min.apply(null,vals):Math.max.apply(null,vals);
}
function renderCmp(){
  if(sel.length<2){ cmp.innerHTML='<div class="empty">Pick at least 2 builds above to compare.</div>'; return; }
  var cs=sel.map(function(k){return byKey[k];});
  var cols='120px repeat('+cs.length+',1fr)';
  var cheapest=best(sel,'budget',-1), fastest=best(sel,'weeks',-1), easiest=best(sel,'diff',-1), mostParts=best(sel,'nparts',1);
  function row(label, cellFn){
    return '<div class="hrow" style="grid-template-columns:'+cols+'"><div class="cell rl">'+label+'</div>'+
      cs.map(function(c){return '<div class="cell" style="--cc:'+c.ac+'">'+cellFn(c)+'</div>';}).join('')+'</div>';
  }
  var html='<div class="grid" style="grid-template-columns:'+cols+'">'+
    '<div class="hrow" style="grid-template-columns:'+cols+'"><div class="cell rl"></div>'+
      cs.map(function(c){return '<div class="cell hcell" style="--cc:'+c.ac+'"><div class="hname">'+c.name+'</div><div class="hfac">'+c.faction+'</div><button class="hx" data-x="'+c.key+'">✕ remove</button></div>';}).join('')+'</div>'+
    row('Budget', function(c){var w=c.budget===cheapest;return '<div class="v'+(w?' win':'')+'">€'+c.budget+'+</div>'+(w?'<div class="winbadge">CHEAPEST</div>':'');})+
    row('Build time', function(c){var w=c.weeks===fastest;return '<div class="v'+(w?' win':'')+'">~'+c.weeks+'w</div>'+(w?'<div class="winbadge">FASTEST</div>':'');})+
    row('Difficulty', function(c){var w=c.diff===easiest;return '<div class="v'+(w?' win':'')+'">'+DIFF[c.diff]+'</div>'+(w?'<div class="winbadge">EASIEST</div>':'');})+
    row('Type', function(c){return '<div class="v">'+(c.type==='armor'?'🛡 Armor':'🧵 Cloth')+'</div><div class="vsub">'+(c.pneed==='big'?'needs printing':'little/no printing')+'</div>';})+
    row('Side', function(c){return '<div class="v">'+(c.side==='light'?'Light':(c.side==='dark'?'Dark':'Neutral'))+'</div>';})+
    row('Components', function(c){var w=c.nparts===mostParts;return '<div class="v'+(w?' win':'')+'">'+c.nparts+'</div>'+(w?'<div class="winbadge">MOST DETAIL</div>':'');})+
    row('Hours', function(c){return '<div class="v" style="font-size:14px">'+(c.hrs||'—')+'</div>';})+
    row('', function(c){return '<a class="bbtn" href="index.html?c='+c.key+'">▶ Build it</a>';})+
  '</div>';
  cmp.innerHTML=html;
  [].slice.call(cmp.querySelectorAll('.hx')).forEach(function(b){b.addEventListener('click',function(){toggle(b.getAttribute('data-x'));});});
}
// preselect two crowd-pleasers
sel=['vader','luke']; renderChips(); renderCmp();
