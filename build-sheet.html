<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUILD SHEET · THE OPERATION SERIES</title>
<meta name="description" content="A printable cosplay build sheet — track your parts, costs, budget, timeline and notes.">
<meta property="og:image" content="social-card.png"><link rel="icon" type="image/png" href="social-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--bg:#050303;--card:#0d0808;--line:#2a1a1d;--text:#e6e0e0;--dim:#8a8284;--gold:#d4a017;--ac:#c8102e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050303;color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar select,.bar button{font-family:'Share Tech Mono',monospace;font-size:13px;background:var(--card);border:1px solid var(--line);
  color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer}
.bar button.go{background:var(--red);color:#fff;border-color:var(--red);font-weight:700;letter-spacing:1px}
.bar button:hover{border-color:var(--red)}
/* the sheet */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:30px 32px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ac);padding-bottom:14px;margin-bottom:18px}
.sh-title{font-family:'Audiowide',sans-serif;font-size:30px;color:#fff;letter-spacing:1px;line-height:1.1}
.sh-title .op{font-size:13px;color:var(--ac);letter-spacing:4px;display:block;font-family:'Share Tech Mono',monospace}
.sh-badge{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--ac);letter-spacing:2px;text-align:right;white-space:nowrap}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.f input{background:transparent;border:none;border-bottom:1px solid var(--line);color:#fff;font-family:'Rajdhani',sans-serif;
  font-size:18px;font-weight:600;padding:4px 2px}
.f input:focus{outline:none;border-bottom-color:var(--ac)}
.sec{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--ac);letter-spacing:3px;margin:22px 0 8px;border-left:3px solid var(--ac);padding-left:8px}
table{width:100%;border-collapse:collapse}
th{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:3px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;padding:5px 2px}
td input:focus{outline:none;background:rgba(255,255,255,.03)}
td.c{text-align:center;width:34px}td.n{width:70px}td.s{width:130px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.eur::before{content:'€';color:var(--dim)}
tfoot td{border-top:2px solid var(--ac);border-bottom:none;font-family:'Audiowide',sans-serif;color:#fff;font-size:15px;padding-top:8px}
.tot{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:13px}
.tot b{font-family:'Audiowide',sans-serif;font-size:18px}
.tot .ok{color:#4a8a4a}.tot .over{color:var(--red)}
.notes{border:1px solid var(--line);border-radius:6px;min-height:120px;margin-top:6px;background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px)}
.notes textarea{width:100%;min-height:120px;background:transparent;border:none;color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:15px;line-height:32px;padding:4px 10px;resize:vertical}
.notes textarea:focus{outline:none}
.photo-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}
.photo-frame{flex:0 0 auto;width:260px;height:300px;border:1px solid var(--line);border-radius:8px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:repeating-conic-gradient(#0e0c0c 0% 25%,#151111 0% 50%) 50%/22px 22px}
.photo-frame img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.photo-empty{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-align:center;padding:14px;line-height:1.6}
.photo-ctrl{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.pbtn{font-family:'Share Tech Mono',monospace;font-size:12px;background:var(--card);border:1px solid var(--line);
  color:var(--text);padding:10px 15px;border-radius:6px;cursor:pointer;text-align:left}
.pbtn:hover{border-color:var(--ac);color:var(--ac)}
.pbtn.go{background:var(--ac);color:#06080a;border-color:var(--ac);font-weight:700}
.pstatus{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);max-width:240px;line-height:1.5}
.card-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:18px}
.card-ov.show{display:flex}
.card-ov canvas{max-width:92vw;max-height:72vh;border-radius:12px;box-shadow:0 16px 60px rgba(0,0,0,.7)}
.card-ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pinput{background:var(--bg);border:1px solid var(--line);color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;padding:9px 12px;border-radius:6px;width:240px}
.pinput:focus{outline:none;border-color:var(--ac)}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;max-width:248px}
.emoji-row button{background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:17px;width:34px;height:32px;cursor:pointer;padding:0}
.emoji-row button:hover{border-color:var(--ac)}
.fmt-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fmt-btn{font-family:'Share Tech Mono',monospace;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:18px;cursor:pointer}
.fmt-btn.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.home{text-align:center;padding:24px 0 40px}.home a{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--dim)}
/* ---- PRINT: clean black-on-white worksheet ---- */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .wrap{max-width:100%;padding:0}
  .sheet{background:#fff;border:none;padding:0;border-radius:0}
  .sh-title,.f input,td input,.tot b,tfoot td{color:#000}
  .sh-top{border-bottom:2px solid #000}
  .sec{color:#000;border-left-color:#000}
  .f input,td,th,.notes{border-color:#999}
  .notes{background:repeating-linear-gradient(transparent,transparent 31px,#bbb 31px,#bbb 32px)}
  .sh-title .op,.sh-badge,.sec,.f label,th{color:#444}
  tfoot td{border-top:2px solid #000}
  .photo-frame{border:1px solid #999;background:#fff;width:210px;height:250px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div class="wrap">
<div class="bar noprint">
  <span style="font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--dim)">PRE-FILL FROM:</span>
  <select id="pick"></select>
  <button class="go" onclick="window.print()">🖨 PRINT SHEET</button>
  <button onclick="if(confirm('Clear this sheet?')){localStorage.removeItem(SKEY());load(document.getElementById('pick').value);}">↻ CLEAR</button>
</div>
<div class="sheet" id="sheet"></div>
<div class="home noprint"><a href="index.html">← back to The Operation Series</a></div>
</div>
<div class="card-ov noprint" id="cardOv">
  <div class="fmt-row" id="fmtRow"></div>
  <canvas id="cardCv"></canvas>
  <div class="row"><button class="pbtn" id="photoToggle" type="button">📷 Photo: On</button><a class="pbtn go" id="cardDl" download="build-card.png">⬇ Download card</a><button class="pbtn" id="cardClose" type="button">✕ Close</button></div>
</div>

}
function loadImg(src){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=src; }); }
function hexA(hex,a){ hex=(hex||'#c8102e').replace('#',''); return 'rgba('+parseInt(hex.substr(0,2),16)+','+parseInt(hex.substr(2,2),16)+','+parseInt(hex.substr(4,2),16)+','+a+')'; }

var FORMATS={
  mini:  {label:'🔖 Mini',   w:600,  h:340,  mode:'mini'},

var photoOn=true;

async function makeCard(fmtKey){

      x.drawImage(im0, pad+(pw-iw0)/2, pyT+(pH-ih0)/2, iw0, ih0); tx=pad+pw+22; }catch(e){} }
    var rW=W-tx-pad;

    x.fillStyle='#fff'; x.font="13px 'Share Tech Mono'"; x.fillText(pct+'% BUILT'+(pct>=100?'  \ud83c\udf89':''), tx, bym+40);
    if(caption){ x.fillStyle='#fff'; x.font="17px Rajdhani"; var capm=caption; while(x.measureText(capm).width>rW && capm.length>3){capm=capm.slice(0,-2);} if(capm!==caption)capm=capm+'\u2026'; x.fillText(capm, tx, 228); }
    if(builder){ x.fillStyle='#fff'; x.font="17px Audiowide"; x.fillText(builder, tx, 258); x.fillStyle='#8a8284'; x.font="10px 'Share Tech Mono'"; x.fillText('B U I L D E R', tx, 273); }
    x.fillStyle=ac; var qfsm=14; do{ x.font='italic '+qfsm+"px Rajdhani"; if(x.measureText(quote).width<=rW) break; qfsm-=1; }while(qfsm>9); x.font='italic '+qfsm+"px Rajdhani"; x.fillText(quote, tx, 306);
  } else {
  // info-column anchors (computed first so the photo can fill the space above)
  var Y;
  if(side){ var st=H*0.5-150; Y={cn:st, n:st+52, pl:st+86, s:st+124, bar:st+150, pct:st+188, cap:st+222, b:st+258, bl:st+276, q:st+310}; }
  else { Y={cn:H-372, n:H-312, pl:H-278, s:H-242, bar:H-216, pct:H-180, cap:H-146, b:H-110, bl:H-91, q:H-46}; }
  // photo region
  var ph = side ? {x:48,y:64,w:W*0.34,h:H-126} : {x:130,y:88,w:W-260,h:Y.cn-88-46};

  if(usePhoto){ try{ var im=await loadImg(photoData); var s=Math.min(ph.w/im.width, ph.h/im.height); var iw=im.width*s, ih=im.height*s;

  // info column
  var cx = (side && showBox) ? (ph.x+ph.w + (W-(ph.x+ph.w))/2) : W/2;
  var maxW = (side && showBox) ? (W-(ph.x+ph.w)-80) : (W-90);
  if(!showBox && !side){ var btop=Y.cn-26, voff=btop-Math.max(46,(H-((Y.q+8)-btop))/2); for(var kk in Y){ Y[kk]-=voff; } }
  x.fillStyle='#8a8284'; x.font="13px 'Share Tech Mono'"; x.fillText('C O D E N A M E', cx, Y.cn);

  x.fillStyle=ac; x.font=fs+"px Audiowide"; x.fillText(word, cx, Y.n);
  x.fillStyle='#cfc8c8'; x.font="20px Rajdhani"; x.fillText(c.partsLabel||'', cx, Y.pl);
  x.fillStyle=ac; x.font="13px 'Share Tech Mono'"; x.fillText(stats, cx, Y.s);
  // progress bar
  var bw=Math.min(maxW-20, 380), bx=cx-bw/2, bh=12;
  x.fillStyle=hexA(ac,0.18); rr(x,bx,Y.bar,bw,bh,6); x.fill();
  if(pct>0){ x.fillStyle=ac; rr(x,bx,Y.bar,Math.max(bh,bw*pct/100),bh,6); x.fill(); }
  x.fillStyle='#fff'; x.font="14px 'Share Tech Mono'"; x.fillText(pct+'% BUILT'+(pct>=100?'  \ud83c\udf89':''), cx, Y.pct);

  if(builder){ x.fillStyle='#fff'; x.font="22px Audiowide"; x.fillText(builder, cx, Y.b); x.fillStyle='#8a8284'; x.font="11px 'Share Tech Mono'"; x.fillText('B U I L D E R', cx, Y.bl); }
  x.fillStyle=ac; var qfs=(side?18:17); do{ x.font='italic '+qfs+"px Rajdhani"; if(x.measureText(quote).width<=maxW) break; qfs-=1; }while(qfs>11); x.font='italic '+qfs+"px Rajdhani"; x.fillText(quote, cx, Y.q);
  }
  var dl=document.getElementById('cardDl'); dl.href=cv.toDataURL('image/png'); dl.download='operation-'+(c.word||'build').toLowerCase().replace(/[^a-z0-9]/g,'')+'-'+curFmt+'.png';
  [].slice.call(document.querySelectorAll('#fmtRow .fmt-btn')).forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-f')===curFmt); });
  document.getElementById('cardOv').classList.add('show');
}
(function(){

function recalc(){
  var est=0, act=0;
  [].slice.call(sheet.querySelectorAll('[data-save=est]')).forEach(function(i){est+=parseFloat(i.value||0)||0;});
  [].slice.call(sheet.querySelectorAll('[data-save=act]')).forEach(function(i){act+=parseFloat(i.value||0)||0;});
  var bud=parseFloat((sheet.querySelector('#f_budget')||{}).value||0)||0;
  sheet.querySelector('#estTot').textContent=est; sheet.querySelector('#actTot').textContent=act;
  sheet.querySelector('#budOut').textContent='€'+bud; sheet.querySelector('#spentOut').textContent='€'+act;
  var rem=sheet.querySelector('#remOut'); var r=bud-act;
  rem.textContent=(r>=0?'Remaining: €'+r:'Over by €'+(-r)); rem.className=r>=0?'ok':'over';
}
function save(){
  var data={};
  [].slice.call(sheet.querySelectorAll('input,textarea')).forEach(function(el,i){
    data['e'+i]= el.type==='checkbox'?el.checked:el.value;
  });
  try{localStorage.setItem(SKEY(),JSON.stringify(data));}catch(e){}
}
function restore(){
  var raw; try{raw=localStorage.getItem(SKEY());}catch(e){}
  if(!raw)return; var data=JSON.parse(raw);
  [].slice.call(sheet.querySelectorAll('input,textarea')).forEach(function(el,i){
    if(data['e'+i]===undefined)return;
    if(el.type==='checkbox')el.checked=data['e'+i]; else el.value=data['e'+i];
  });
}
function wire(){
  [].slice.call(sheet.querySelectorAll('input,textarea')).forEach(function(el){
    el.addEventListener('input',function(){recalc();save();});
    el.addEventListener('change',function(){recalc();save();});
  });
}
