var byKey={}; C.forEach(function(c){byKey[c.key]=c;});
var sel=[];
var chips=document.getElementById('chips'), out=document.getElementById('out'),
    squadline=document.getElementById('squadline'), presets=document.getElementById('presets');
presets.innerHTML=PRESETS.map(function(p,i){return '<button class="preset" data-i="'+i+'">'+p.name+'</button>';}).join('');
[].slice.call(presets.querySelectorAll('.preset')).forEach(function(b){b.addEventListener('click',function(){
  sel=PRESETS[+b.getAttribute('data-i')].keys.filter(function(k){return byKey[k];}); render();});});
function renderChips(){
  chips.innerHTML=C.map(function(c){return '<button class="chip'+(sel.indexOf(c.key)>=0?' on':'')+'" style="--cc:'+c.ac+'" data-k="'+c.key+'"><span class="d"></span>'+c.name+'</button>';}).join('');
  [].slice.call(chips.querySelectorAll('.chip')).forEach(function(b){b.addEventListener('click',function(){
    var k=b.getAttribute('data-k'), i=sel.indexOf(k); if(i>=0)sel.splice(i,1); else sel.push(k); render();});});
}
function merge(field){
  var map={};
  sel.forEach(function(k){ (byKey[k][field]||[]).forEach(function(name){
    var n=name.replace(/\s*\(.*?\)\s*/g,'').trim(); if(!n)return;
    var id=n.toLowerCase();
    if(!map[id])map[id]={name:n,who:[]};
    if(map[id].who.indexOf(byKey[k].name)<0)map[id].who.push(byKey[k].name);
  });});
  return Object.keys(map).map(function(id){return map[id];}).sort(function(a,b){return b.who.length-a.who.length;});
}
function listCol(title, sub, arr){
  if(!arr.length)return '';
  return '<div class="col"><h3>'+title+'</h3><div class="ch">'+sub+'</div>'+
    arr.map(function(it){return '<div class="it"><span class="q">×'+it.who.length+'</span><span class="n">'+it.name+'</span><span class="who">'+it.who.join(', ')+'</span></div>';}).join('')+'</div>';
}
function render(){
  renderChips();
  if(!sel.length){ squadline.innerHTML=''; out.innerHTML='<div class="empty">Pick a quick squad above, or tap characters to build your crew.</div>'; return; }

}
