var Q=[
 {k:'side',q:'Pick your allegiance',sub:'Who do you want to be?',opts:[
   {v:'light',ic:'🔵',t:'Light side',d:'Jedi & heroes'},
   {v:'dark',ic:'🔴',t:'Dark side',d:'Sith & villains'},
   {v:'neutral',ic:'⚙️',t:'Soldiers & hunters',d:'Troopers, Mandalorians, bounty hunters, droids'},
   {v:'any',ic:'✨',t:'Surprise me',d:'No preference'} ]},
 {k:'budget',q:"What's your budget?",sub:'Roughly, all-in.',opts:[
   {v:'tight',ic:'💸',t:'Tight',d:'Under €120'},
   {v:'mid',ic:'💰',t:'Medium',d:'€120 – €350'},
   {v:'big',ic:'🏦',t:'Go big',d:'€350+'},
   {v:'any',ic:'🤷',t:"Doesn't matter",d:'Money is no object'} ]},
 {k:'exp',q:'Built a costume before?',sub:'Be honest — it picks the right difficulty.',opts:[
   {v:'first',ic:'🌱',t:'First time ever',d:'Total beginner'},
   {v:'some',ic:'🔧',t:'A little',d:"Done a piece or two"},
   {v:'pro',ic:'🛠️',t:'Experienced',d:'Bring on the hard mode'} ]},
 {k:'printer',q:'Your making setup?',sub:'What can you actually produce?',opts:[
   {v:'none',ic:'🧵',t:'No 3D printer',d:'Cloth & makeup only'},
   {v:'small',ic:'🖨️',t:'Small printer',d:"I can print, splitting is a pain"},
   {v:'big',ic:'🏭',t:'Big printer',d:"Or happy to split, sand & grind"} ]}
];
var step=0, ans={};
var dots=document.getElementById('dots'), card=document.getElementById('quizCard'), result=document.getElementById('result');
function renderDots(){dots.innerHTML=Q.map(function(_,i){return '<div class="dot '+(i<step?'done':(i===step?'on':''))+'"></div>';}).join('')+'<div class="dot '+(step>=Q.length?'on':'')+'"></div>';}
function renderStep(){
  renderDots();
  if(step>=Q.length){showResult();return;}
  var s=Q[step];
  card.style.display='block'; result.classList.remove('show');
  card.innerHTML='<div class="q">'+s.q+'</div><div class="qsub">'+s.sub+'</div><div class="opts">'+
    s.opts.map(function(o,i){return '<button class="opt" data-v="'+o.v+'"><span class="ic">'+o.ic+'</span><span><span class="ot">'+o.t+'</span><br><span class="od">'+o.d+'</span></span></button>';}).join('')+
    '</div>'+(step>0?'<button class="back" id="bk">‹ back</button>':'');
  [].slice.call(card.querySelectorAll('.opt')).forEach(function(b){b.addEventListener('click',function(){ans[s.k]=b.getAttribute('data-v');step++;renderStep();});});
  var bk=document.getElementById('bk'); if(bk)bk.addEventListener('click',function(){step--;renderStep();});
}
function score(c){
  var s=0, why=[];
  // side
  if(ans.side!=='any'){ if(c.side===ans.side){s+=120; why.push('side');} else {s-=70;} }
  // budget
  var targ={tight:100,mid:235,big:360}[ans.budget];
  if(ans.budget!=='any'){
    var over=c.budget-targ;
    s+= 60 - Math.abs(over)/5;
    if(ans.budget==='tight' && c.budget>140) s-=90;
    if(ans.budget==='big' && c.budget>=300) {s+=25; why.push('budget');}
    if(ans.budget==='tight' && c.budget<=120){s+=25; why.push('budget');}
    if(ans.budget==='mid' && c.budget>=120 && c.budget<=350){s+=20; why.push('budget');}
  }
  // experience -> difficulty
  var want={first:1,some:2,pro:3}[ans.exp];
  s+= 50 - Math.abs(c.diff-want)*45;
  if(c.diff===want) why.push('exp');
  // printer
  if(ans.printer==='none'){ if(c.type==='cloth'){s+=90;why.push('printer');} else {s-=140;} }
  else if(ans.printer==='small'){ if(c.type==='cloth'){s+=40;} else {s-=35;} }
  else { if(c.type==='armor'){s+=45;why.push('printer');} }
  s += Math.random()*8; // tiny tiebreak
  return {s:s, why:why};
}
function whyText(c,why){
  var bits=[];
  if(why.indexOf('side')>=0) bits.push(c.side==='light'?'a light-side hero':(c.side==='dark'?'a proper dark-side villain':'an armor/soldier build'));
  if(why.indexOf('printer')>=0) bits.push(c.type==='cloth'?'mostly cloth & makeup — little to no printing':'a meaty 3D-print build for your setup');
  if(why.indexOf('exp')>=0) bits.push(c.diff===1?'beginner-friendly':(c.diff===3?'a real challenge':'a solid step-up'));
  if(why.indexOf('budget')>=0) bits.push('right in your budget');
  if(!bits.length) bits.push('the closest match to what you picked');
  return bits.join(', ');
}
function pubPdf(k){return k==='vader'?'manual_public.pdf':k+'_public.pdf';}
function showResult(){
  card.style.display='none';
  var ranked=CHARS.map(function(c){var r=score(c);return {c:c,s:r.s,why:r.why};}).sort(function(a,b){return b.s-a.s;});
  var top=ranked[0], alts=ranked.slice(1,4);
  var c=top.c;
  document.documentElement.style.setProperty('--ac',c.ac);
  result.style.setProperty('--ac',c.ac);
  result.innerHTML=
   '<div class="rlabel">▌ YOUR MATCH</div>'+
   '<div class="rname">'+c.name.toUpperCase()+'</div>'+
   '<div class="rfaction">'+c.faction+'</div>'+
   '<div class="rwhy"><b>Why this fits you:</b> '+c.name+' is '+whyText(c,top.why)+'. '+(c.quote?'<i>“'+c.quote+'”</i>':'')+'</div>'+
   '<div class="rstats">'+
     '<div class="rstat"><div class="v">€'+c.budget+'+</div><div class="l">Budget</div></div>'+
     '<div class="rstat"><div class="v">~'+c.weeks+'w</div><div class="l">Build time</div></div>'+
     '<div class="rstat"><div class="v">'+['','Beginner','Medium','Advanced'][c.diff]+'</div><div class="l">Difficulty</div></div>'+
   '</div>'+
   '<div class="rbtns">'+
     '<a class="rbtn solid" href="index.html?c='+c.key+'">▶ Build it on site</a>'+
     '<a class="rbtn" href="'+pubPdf(c.key)+'" target="_blank" rel="noopener">Read the manual</a>'+
     '<a class="rbtn" href="checklist.html?c='+c.key+'" target="_blank" rel="noopener">Parts checklist</a>'+
   '</div>'+
   '<div class="alts"><h3>▌ ALSO A GREAT FIT</h3><div class="altrow">'+
     alts.map(function(a){return '<a class="alt" style="--a2:'+a.c.ac+'" href="index.html?c='+a.c.key+'"><div class="an">'+a.c.name+'</div><div class="af">'+a.c.faction+'</div></a>';}).join('')+
   '</div></div>'+
   '<button class="restart" id="rs">↻ start over</button>';
  result.classList.add('show');
  document.getElementById('rs').addEventListener('click',function(){step=0;ans={};document.documentElement.style.setProperty('--ac','#c8102e');renderStep();window.scrollTo({top:0,behavior:'smooth'});});
  result.scrollIntoView({behavior:'smooth',block:'start'});
}
renderStep();
